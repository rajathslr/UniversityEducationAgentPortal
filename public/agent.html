<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meridian Agent Portal</title>
  <link rel="stylesheet" href="/css/nocturne.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css" />

  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="topnav">
    <div class="brand"><div class="mark"><span>M</span></div><b>Meridian Agent Portal</b></div>
    <div class="sep"></div>
    <div class="who" id="whoami">—</div>
    <div class="spacer"></div>
    <div id="userChip"></div>
  </nav>

  <div class="hero">
    <div class="eyebrow" id="heroEyebrow">Your application</div>
    <h1 id="heroTitle">—</h1>
    <p id="heroSub">—</p>
    <div id="heroRail"></div>
  </div>

  <div class="appshell">
    <aside class="sidebar" id="agentNav" aria-label="Agent navigation">
      <div class="side-h">Menu</div>
      <a href="#" data-tab="application" class="active"><i class="ic ph-fill ph-identification-card"></i>My application</a>
      <a href="#" data-tab="collateral"><i class="ic ph ph-files"></i>Marketing materials <span class="b" id="ackBadge" style="display:none"></span></a>
      <a href="#" data-tab="students"><i class="ic ph ph-student"></i>My students</a>
      <a href="#" data-tab="commissions"><i class="ic ph ph-scales"></i>Commissions</a>
      <a href="#" data-tab="account"><i class="ic ph ph-gear"></i>Account</a>
    </aside>
    <main class="content">
      <section class="panel show" id="tab-application"></section>
      <section class="panel" id="tab-collateral"></section>
      <section class="panel" id="tab-account"></section>
      <section class="panel" id="tab-students"></section>
      <section class="panel" id="tab-commissions"></section>
    </main>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/agent.js"></script>
</body>
</html>

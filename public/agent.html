<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Meridian Agent Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <nav class="topnav">
    <div class="brand"><div class="mark"><span>M</span></div><b>Meridian Agent Portal</b></div>
    <div class="sep"></div>
    <div class="who" id="whoami">—</div>
    <div class="spacer"></div>
    <div id="userChip"></div>
  </nav>

  <div class="hero">
    <div class="eyebrow" id="heroEyebrow">Your application</div>
    <h1 id="heroTitle">—</h1>
    <p id="heroSub">—</p>
    <div id="heroRail"></div>
  </div>

  <div class="tabs">
    <a href="#" data-tab="application" class="active">My application</a>
    <a href="#" data-tab="collateral">Marketing materials <span class="b" id="ackBadge" style="display:none"></span></a>
    <a href="#" data-tab="students">My students</a>
    <a href="#" data-tab="commissions">Commissions</a>
    <a href="#" data-tab="account">Account</a>
  </div>

  <div class="wrap">
    <section class="panel show" id="tab-application"></section>
    <section class="panel" id="tab-collateral"></section>
    <section class="panel" id="tab-account"></section>
    <section class="panel" id="tab-students"></section>
    <section class="panel" id="tab-commissions"></section>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/agent.js"></script>
</body>
</html>

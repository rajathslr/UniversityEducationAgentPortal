<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Meridian AMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css" />
  <style>
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px;
      background:radial-gradient(1200px 500px at 50% -10%, var(--teal-soft), var(--paper))}
    .auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line);
      border-radius:16px;box-shadow:var(--shadow);padding:30px 28px}
    .auth-brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
    .auth-brand .mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(150deg,var(--teal),var(--teal-deep));
      display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;font-family:"Archivo"}
    .auth-brand b{font-family:"Archivo";font-size:15px}
    .auth-card h1{font-family:"Archivo";font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
    .auth-card .sub{color:var(--muted);font-size:13px;margin:0 0 20px}
    .auth-card .field{margin-bottom:14px}
    .auth-err{display:none;background:var(--red-soft);color:var(--red);border:1px solid var(--red);
      border-radius:8px;padding:9px 12px;font-size:12.5px;margin-bottom:14px}
    .auth-err.show{display:block}
    .tlsnote{margin-top:18px;font-size:11.5px;color:var(--muted-2);display:flex;gap:7px;align-items:flex-start}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <form class="auth-card" id="loginForm" autocomplete="on">
      <div class="auth-brand"><div class="mark">M</div><b>Meridian University</b></div>
      <h1>Sign in</h1>
      <p class="sub">Agent Management System</p>
      <div class="auth-err" id="err"></div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" autofocus required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button class="btn primary block" type="submit" id="submitBtn">Sign in</button>
      <div class="tlsnote"><span>🔒</span><span>Connection secured with TLS (self-signed certificate). Your password is sent over HTTPS and stored only as a salted hash.</span></div>
    </form>
  </div>

  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
